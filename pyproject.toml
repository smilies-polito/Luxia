[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luxia"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = [
]
authors = [
  { name="Tzamn Melendez", email="tzamn.melendez@polito.it" },
  { name="Marco P. Abrate", email="marco.abrate@ucl.ac.uk" },
]
description = "Photon Neural Networks"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["photonic"]

[project.urls]
Homepage = "https://github.com/smilies-polito/Luxia"
