[build-system]
requires = [
  "setuptools>=68",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "luxia"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
  "torch",
]
authors = [
  { name = "Tzamn Melendez", email = "tzamn.melendez@polito.it" },
  { name = "Marco P. Abrate", email = "marco.abrate@ucl.ac.uk" },
]
description = "Photonic neural networks"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "photonic",
  "photonics",
  "neural-networks",
  "machine-learning",
  "pytorch",
  "optical-computing",
]

[project.urls]
Homepage = "https://gitlabtsgroup.polito.it/root/luxia"
Source = "https://gitlabtsgroup.polito.it/root/luxia"
Issues = "https://gitlabtsgroup.polito.it/root/luxia/-/issues"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["tests/python"]
